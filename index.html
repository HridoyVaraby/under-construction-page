<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Under Construction</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="construction-icon.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="description" content="Our website is under construction. We're working hard to give you the best experience.">
</head>
<body>
    <!-- Particle Background -->
    <div class="particle-container">
        <div id="particles-js"></div>
    </div>
    <div class="overlay"></div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-12 animate-fade-in">
        <div class="w-full max-w-4xl mx-auto space-y-12">

            <!-- Header / Logo -->
            <header class="text-center space-y-4 animate-slide-up">
                <div class="inline-flex items-center gap-3 px-6 py-3 rounded-full bg-white/5 backdrop-blur-sm border border-white/10 mb-4">
                    <div class="relative">
                        <img src="construction-icon.webp" alt="Construction Icon" width="32" height="32" class="animate-float">
                        <div class="absolute inset-0 bg-primary/20 blur-xl rounded-full"></div>
                    </div>
                    <span class="font-display font-bold text-lg tracking-wide">Under Construction</span>
                </div>
            </header>

            <!-- Hero Section -->
            <section class="text-center space-y-6 animate-slide-up" style="animation-delay: 0.1s">
                <h1 class="font-display font-bold text-4xl sm:text-5xl md:text-6xl lg:text-7xl leading-tight">
                    We're <span class="gradient-text relative inline-block">Coming Soon</span>
                </h1>
                <p class="text-muted-foreground text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">
                    Our website is under construction. We're working hard to give you the best experience with our new website.
                </p>
            </section>

            <!-- Countdown Timer -->
            <section class="animate-slide-up" style="animation-delay: 0.2s">
                <div class="flex flex-wrap justify-center gap-3 sm:gap-4 md:gap-6">
                    <!-- Days -->
                    <div class="countdown-card group">
                        <div class="text-3xl sm:text-4xl md:text-5xl font-display font-bold gradient-text" id="days">00</div>
                        <div class="text-xs sm:text-sm text-muted-foreground uppercase tracking-widest mt-2">Days</div>
                    </div>
                    <!-- Hours -->
                    <div class="countdown-card group">
                        <div class="text-3xl sm:text-4xl md:text-5xl font-display font-bold gradient-text" id="hours">00</div>
                        <div class="text-xs sm:text-sm text-muted-foreground uppercase tracking-widest mt-2">Hours</div>
                    </div>
                    <!-- Minutes -->
                    <div class="countdown-card group">
                        <div class="text-3xl sm:text-4xl md:text-5xl font-display font-bold gradient-text" id="minutes">00</div>
                        <div class="text-xs sm:text-sm text-muted-foreground uppercase tracking-widest mt-2">Minutes</div>
                    </div>
                    <!-- Seconds -->
                    <div class="countdown-card group">
                        <div class="text-3xl sm:text-4xl md:text-5xl font-display font-bold gradient-text" id="seconds">00</div>
                        <div class="text-xs sm:text-sm text-muted-foreground uppercase tracking-widest mt-2">Seconds</div>
                    </div>
                </div>
            </section>

            <!-- Email Subscribe Form -->
            <section class="animate-slide-up" style="animation-delay: 0.3s">
                <div class="glass-card max-w-lg mx-auto p-6 sm:p-8">
                    <h3 class="text-center font-semibold text-lg mb-6">Get Notified When We Launch</h3>
                    <form id="subscribe-form" class="flex flex-col sm:flex-row gap-3">
                        <div class="flex-1 relative">
                            <input
                                type="email"
                                id="email-input"
                                placeholder="Enter your email address"
                                class="w-full px-5 py-3 rounded-full bg-white/10 backdrop-blur border border-white/20 text-white placeholder:text-white/50 outline-none focus:border-primary/50 focus:ring-2 focus:ring-primary/20 transition-all"
                            >
                        </div>
                        <button
                            type="submit"
                            class="btn-primary whitespace-nowrap relative overflow-hidden group"
                        >
                            <span class="relative z-10 flex items-center gap-2">
                                <span>Notify Me</span>
                                <i class="fas fa-paper-plane text-sm group-hover:translate-x-1 transition-transform"></i>
                            </span>
                            <div class="absolute inset-0 bg-gradient-to-r from-accent to-primary opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                        </button>
                    </form>
                    <div id="form-message" class="hidden text-center mt-4 text-sm"></div>
                </div>
            </section>

            <!-- Social Links -->
            <footer class="animate-slide-up" style="animation-delay: 0.4s">
                <div class="flex justify-center gap-4">
                    <a href="#" class="social-btn" aria-label="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="social-btn" aria-label="Twitter">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="#" class="social-btn" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="#" class="social-btn" aria-label="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="#" class="social-btn" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
                <p class="text-center text-muted-foreground text-sm mt-8">
                    &copy; <span id="current-year"></span> All rights reserved.
                </p>
            </footer>
        </div>
    </main>

    <!-- Loading Animation -->
    <div id="loading-animation" class="fixed inset-0 bg-background z-50 flex items-center justify-center transition-opacity duration-500">
        <div class="relative">
            <div class="w-12 h-12 border-4 border-white/10 border-t-primary rounded-full animate-spin"></div>
            <div class="absolute inset-0 w-12 h-12 border-4 border-transparent border-r-accent rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
